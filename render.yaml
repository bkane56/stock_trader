# Render Blueprint — stock-trader API (FastAPI)
# Connect repo → New Blueprint, or create Web Service manually with same settings.
# Set secrets (OPENAI_API_KEY, market data keys, CORS) in the Render dashboard.

services:
  - type: web
    name: stock-trader-api
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./python_ai/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_LOG_LEVEL
        value: INFO
      - key: AI_MODEL
        value: gpt-5-nano
      # Set API_SECRET_KEY in the Render dashboard and mirror it in Vercel as VITE_API_SECRET_KEY.
